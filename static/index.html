  <head>
    <meta charset="utf-8">

    <title>miso-plane — a Flappy-style game in Haskell</title>
    <meta name="description" content="A Flappy-Bird-style plane game written in Haskell and compiled to WebAssembly with the miso framework. Tap, click or press space to fly.">

    <meta property="og:url" content="https://plane.haskell-miso.org/">

    <meta property="og:description" content="Tap, click or press space to fly. Written in Haskell, compiled to WebAssembly with miso.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="miso-plane — a Flappy-style game in Haskell">
    <meta name="twitter:description" content="A Flappy-Bird-style game written in Haskell, compiled to WebAssembly with miso.">
    <link rel="icon" href="favicon.ico">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "miso-plane",
      "url": "https://plane.haskell-miso.org/",
      "gamePlatform": "Web",
      "description": "A Flappy-Bird-style plane game written in Haskell and compiled to WebAssembly with the miso framework.",
      "codeRepository": "https://github.com/haskell-miso/miso-plane"
    }
    </script>
    <style>
      :root {
        --bg: #0f1a26;
        --panel-edge: #2b3a4d;
        --muted: #93a4b8;
        --accent: #fd6c6c;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background:
          radial-gradient(900px 500px at 50% -10%, rgba(253, 108, 108, .08), transparent),
          var(--bg);
        color: #e9edf3;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        overflow: hidden;
      }
      .stage {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }
      .game {
        position: relative;
        width: 480px;
        height: 480px;
        overflow: hidden;
        border-radius: 16px;
        border: 1px solid var(--panel-edge);
        box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
        cursor: pointer;
        touch-action: manipulation;
        transform: scale(min(1, calc((100vw - 24px) / 480)));
      }
      .help {
        margin: 0;
        color: var(--muted);
        font-size: .95rem;
        text-align: center;
      }
      .score {
        position: absolute;
        top: 40px;
        width: 100%;
        margin: 0;
        text-align: center;
        color: #fff;
        font-size: 44px;
        font-weight: 800;
        text-shadow: 0 2px 0 rgba(0, 0, 0, .45);
        pointer-events: none;
        user-select: none;
      }
      .github-corner { position: absolute; top: 0; right: 0; }
      .github-corner svg { fill: var(--accent); color: var(--bg); width: 70px; height: 70px; }
      body:has(> .app) .boot, body:has(> .stage) .boot { display: none; }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        background: var(--bg);
      }
      .boot .spin {
        width: 42px; height: 42px;
        border-radius: 50%;
        border: 3px solid var(--panel-edge);
        border-top-color: var(--accent);
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="boot">
      <div class="spin" aria-hidden="true"></div>
      <p>Loading Haskell WebAssembly&hellip;</p>
      <noscript>miso-plane is a WebAssembly game and needs JavaScript enabled.</noscript>
    </div>
